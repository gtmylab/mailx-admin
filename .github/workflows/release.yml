# Release pipeline for the mailx-admin panel.
#
# Why this file exists: Mailx-Installer never compiles the panel. Stage 13e runs
#
#   wget -O /usr/local/bin/mailx-admin \
#     https://github.com/gtmylab/mailx-admin/releases/latest/download/mailx-admin-linux-amd64
#
# so the Linux asset has to be published somewhere before a production install
# can succeed. cgo (github.com/mattn/go-sqlite3) cannot be cross-compiled, which
# is why the build runs on a Linux runner here instead of on a workstation.
#
# Releasing:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The installer's wget is unauthenticated, so the repository (or at least the
# release asset) must be publicly readable. On a private repo, install offline
# instead: copy the binary to /tmp/mailx-admin before running the installer.
#
# Published per tag:
#   mailx-admin-linux-amd64  the version-stamped binary stage 13e downloads
#   SHA256SUMS               covers that binary and Mailx-Installer
#   Mailx-Installer          the installer itself, as of this tag
# Mailx-Installer keeps the same file name in every release (it is
# version-agnostic and always pulls the newest binary), so
# releases/latest/download/Mailx-Installer is a stable place to fetch it from
# and a host is never stuck re-running a stale copy.
#
# Re-publishing an existing tag is safe - the publish step clobbers its assets:
#   Actions > Release > Run workflow, tag: v1.0.10-devbeta-2
#
# A test build is tagged and published like any other release (v1.0.10-devbeta,
# v1.0.10-devbeta-2), and `gh release create` below makes a *normal* release,
# never a prerelease - deliberately. The installer fetches
# releases/latest/download/mailx-admin-linux-amd64, GitHub keeps prereleases out
# of "latest", so marking a test build as a prerelease would leave a fresh
# server installing the previous one while the new tag sits there looking
# published. To keep a build away from new installs, do not push its tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    name: Build and publish mailx-admin-linux-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: ver
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag '$tag' must start with 'v' (e.g. v1.0.0)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
          fetch-depth: 0 # full history so 'git describe --tags' resolves

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the cgo toolchain
        run: |
          set -euo pipefail
          go version
          gcc --version | head -n 1
          go env CGO_ENABLED

      - name: Check formatting and vet
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files - run 'make lint' locally"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Test
        run: make test

      - name: Build the Linux release artifact
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          echo "building version $VERSION from commit $commit"
          make release VERSION="$VERSION" COMMIT="$commit"

      - name: Assert the binary reports the tagged version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          out="$(./bin/mailx-admin-linux-amd64 --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::built binary does not report version $VERSION - version stamping is broken"; exit 1 ;;
          esac
          test -s bin/SHA256SUMS
          cat bin/SHA256SUMS

      - name: Add the installer to the artifact set
        run: |
          set -euo pipefail
          # Mailx-Installer ships with the release so a server can fetch the
          # current one instead of re-running whatever copy it downloaded months
          # ago:
          #   .../releases/latest/download/Mailx-Installer
          # It stays unversioned on purpose: it is version-agnostic and always
          # downloads releases/latest/download/mailx-admin-linux-amd64. Publishing
          # it per tag is what stops a host from reusing stale installer logic
          # the panel has since outgrown (it used to append to /etc/postfix/
          # virtual, a file the panel rewrites from its database on every sync).
          test -s Mailx-Installer
          head -n 1 Mailx-Installer | grep -q '^#!' \
            || { echo "::error::Mailx-Installer does not start with a shebang"; exit 1; }
          # The installer looks its checksum up by name (awk '$2 == name'), not
          # with 'sha256sum -c', so one extra line is harmless to older copies.
          if ! grep -qE '[[:space:]]\*?Mailx-Installer$' bin/SHA256SUMS; then
            sha256sum Mailx-Installer >> bin/SHA256SUMS
          fi
          cat bin/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - replacing its assets"
            gh release upload "$TAG" \
              bin/mailx-admin-linux-amd64 bin/SHA256SUMS Mailx-Installer --clobber
          else
            gh release create "$TAG" \
              bin/mailx-admin-linux-amd64 bin/SHA256SUMS Mailx-Installer \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Job summary
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Released ${TAG}"
            echo ""
            echo "Assets: mailx-admin-linux-amd64, SHA256SUMS and Mailx-Installer."
            echo "The installer is version-agnostic (it always pulls"
            echo "releases/latest/download/mailx-admin-linux-amd64), so it is the same"
            echo "file for every release; publishing it per tag is what keeps a host"
            echo "from re-running a stale copy."
            echo ""
            echo "Fetch this release's installer (or upgrade an existing host):"
            echo ""
            echo "    curl -fsSLO https://github.com/gtmylab/mailx-admin/releases/latest/download/Mailx-Installer"
            echo "    chmod +x Mailx-Installer"
            echo ""
            echo "Install or upgrade on a server:"
            echo ""
            echo '    MAILX_ADMIN_FORCE_REINSTALL=1 ./Mailx-Installer'
            echo '    /usr/local/bin/mailx-admin --version'
            echo ""
            echo "Checksums:"
            echo ""
            cat bin/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
