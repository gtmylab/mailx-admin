{{define "content"}}
<div class="space-y-4">
  <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
    <div class="grid grid-cols-6 gap-3">
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">Domain</span>
        <input type="text" name="domain" placeholder="example.com"
               hx-get="/logs/list" hx-trigger="keyup changed delay:300ms"
               hx-target="#log-rows" hx-include="closest .rounded-lg"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
      </label>
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">From</span>
        <input type="text" name="from"
               hx-get="/logs/list" hx-trigger="keyup changed delay:300ms"
               hx-target="#log-rows" hx-include="closest .rounded-lg"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
      </label>
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">To</span>
        <input type="text" name="to"
               hx-get="/logs/list" hx-trigger="keyup changed delay:300ms"
               hx-target="#log-rows" hx-include="closest .rounded-lg"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
      </label>
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">Status</span>
        <select name="status"
                hx-get="/logs/list" hx-trigger="change"
                hx-target="#log-rows" hx-include="closest .rounded-lg"
                class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
          <option value="">all</option>
          <option value="sent">sent</option>
          <option value="deferred">deferred</option>
          <option value="bounced">bounced</option>
          <option value="rejected">rejected</option>
        </select>
      </label>
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">Since</span>
        <select name="since"
                hx-get="/logs/list" hx-trigger="change"
                hx-target="#log-rows" hx-include="closest .rounded-lg"
                class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
          <option value="">all time</option>
          <option value="1h">last hour</option>
          <option value="24h">last 24h</option>
          <option value="168h">last 7 days</option>
        </select>
      </label>
      <label class="block">
        <span class="text-xs text-slate-500 uppercase">Search</span>
        <input type="text" name="q" placeholder="raw text…"
               hx-get="/logs/list" hx-trigger="keyup changed delay:300ms"
               hx-target="#log-rows" hx-include="closest .rounded-lg"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-2 py-1.5 text-sm">
      </label>
    </div>
    <div class="mt-3 flex items-center justify-between">
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" id="live-toggle" onchange="toggleLive(this.checked)">
        <span class="text-slate-300">Live tail</span>
        <span id="live-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
      </label>
      <button hx-get="/logs/list" hx-target="#log-rows" hx-include="closest .rounded-lg"
              class="rounded border border-slate-700 px-3 py-1.5 text-sm hover:bg-slate-800">
        Refresh
      </button>
    </div>
  </div>

  <div class="rounded-lg border border-slate-800 bg-slate-900 overflow-hidden">
    <div class="overflow-x-auto max-h-[70vh]">
      <table class="w-full text-xs">
        <thead class="bg-slate-950 text-slate-500 sticky top-0 z-10">
          <tr>
            <th class="text-left px-3 py-2 uppercase tracking-wider">Time</th>
            <th class="text-left px-3 py-2 uppercase tracking-wider">Queue</th>
            <th class="text-left px-3 py-2 uppercase tracking-wider">Status</th>
            <th class="text-left px-3 py-2 uppercase tracking-wider">From</th>
            <th class="text-left px-3 py-2 uppercase tracking-wider">To</th>
            <th class="text-left px-3 py-2 uppercase tracking-wider">Message</th>
          </tr>
        </thead>
        <tbody id="log-rows"
               hx-get="/logs/list" hx-trigger="load"
               hx-swap="innerHTML">
          <tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let evtSource = null;

  function toggleLive(on) {
    const dot = document.getElementById('live-dot');
    if (on) {
      dot.classList.remove('bg-slate-600');
      dot.classList.add('bg-emerald-500');
      evtSource = new EventSource('/logs/live');
      evtSource.addEventListener('log', (e) => {
        const tbody = document.getElementById('log-rows');
        tbody.insertAdjacentHTML('afterbegin', e.data);
        // Cap at 500 rows
        while (tbody.children.length > 500) tbody.lastElementChild.remove();
      });
      evtSource.onerror = () => {
        dot.classList.remove('bg-emerald-500');
        dot.classList.add('bg-red-500');
      };
    } else {
      dot.classList.remove('bg-emerald-500');
      dot.classList.add('bg-slate-600');
      if (evtSource) evtSource.close();
      evtSource = null;
    }
  }
</script>
{{end}}
