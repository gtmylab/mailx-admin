{{define "content"}}
<div class="page-header">
  <div>
    <h1>Mail import</h1>
    <p class="page-sub">Import mail from Google Workspace, Microsoft 365, cPanel or another server into a local mailbox, preserving folders, flags, read state and sent dates.</p>
  </div>
</div>

<div class="card">
  <div class="card-header"><h2>New import</h2></div>
  <div class="card-body">
    <form class="form" hx-post="/system/import" hx-target="#import-result" hx-swap="innerHTML"
          hx-confirm="Import mail into the selected mailbox?">
      <div class="grid grid-cols-2 gap-4">
        <label class="field">
          <span class="field-label">Destination mailbox</span>
          <select class="select" name="user_id">
            {{range .Data.Users}}
            <option value="{{.ID}}">{{.Email}}</option>
            {{end}}
          </select>
        </label>
        <label class="field">
          <span class="field-label">Source</span>
          <select class="select" name="source">
            <option value="imap" selected>IMAP (Google / Microsoft 365 / Mailcow / Mailu / iRedMail)</option>
            <option value="mbox">mbox file or directory (cPanel)</option>
            <option value="maildir">Maildir copy (filesystem access)</option>
          </select>
        </label>
      </div>

      <fieldset class="mt-4">
        <legend class="strong text-sm">IMAP server</legend>
        <div class="grid grid-cols-3 gap-4">
          <label class="field">
            <span class="field-label">Host</span>
            <input class="input" type="text" name="host" placeholder="imap.gmail.com">
          </label>
          <label class="field">
            <span class="field-label">Port</span>
            <input class="input" type="number" name="port" value="993">
          </label>
          <label class="field">
            <span class="field-label">Encryption</span>
            <select class="select" name="tls_mode">
              <option value="tls" selected>SSL/TLS</option>
              <option value="starttls">STARTTLS</option>
              <option value="">None</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Username (email)</span>
            <input class="input" type="text" name="username" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label">Password (app password)</span>
            <input class="input" type="password" name="password" autocomplete="new-password">
          </label>
        </div>
      </fieldset>

      <fieldset class="mt-4">
        <legend class="strong text-sm">File source (mbox or Maildir)</legend>
        <label class="field">
          <span class="field-label">Path</span>
          <input class="input" type="text" name="path" placeholder="/path/to/mailbox.mbox or /path/to/Maildir">
          <span class="field-hint">mbox: a single .mbox file or a directory of .mbox files. Maildir: the source Maildir root.</span>
        </label>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Start import</button>
      </div>
    </form>
    <div id="import-result"></div>
  </div>
</div>
{{end}}
