{{define "group_form"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="group-form-title">
  <div class="modal-panel max-w-lg">
    <header class="modal-header">
      <h3 id="group-form-title">{{if .Group.ID}}Edit group{{else}}Add group{{end}}</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <form class="modal-body form" hx-post="/system/groups" hx-target="#form-error" hx-swap="innerHTML">
      <div class="form-error-slot" data-modal-error></div>
      <input type="hidden" name="id" value="{{if .Group.ID}}{{.Group.ID}}{{end}}">
      <div class="grid grid-cols-2 gap-4">
        <label class="field">
          <span class="field-label">Name</span>
          <input class="input" type="text" name="name" value="{{.Group.Name}}" required>
        </label>
        <label class="field">
          <span class="field-label">Base role</span>
          <select class="select" name="role">
            {{range .Roles}}<option value="{{.}}" {{if eq . $.Group.Role}}selected{{end}}>{{.}}</option>{{end}}
          </select>
        </label>
      </div>
      <div class="mt-3">
        <span class="field-label">Extra permissions</span>
        {{range .Permissions}}
        <label class="check-row">
          <input class="checkbox" type="checkbox" name="perm_{{.Key}}" value="1" {{if index $.PermSet .Key}}checked{{end}}>
          <span>{{.Label}} <span class="dim mono text-xs">{{.Key}}</span></span>
        </label>
        {{end}}
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">{{if .Group.ID}}Save{{else}}Create{{end}}</button>
      </div>
    </form>
  </div>
</div>
{{end}}
