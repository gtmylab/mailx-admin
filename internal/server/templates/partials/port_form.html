{{define "port_form"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="port-form-title">
  <div class="modal-panel max-w-md">
    <header class="modal-header">
      <h3 id="port-form-title">Add SMTP listener</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <form class="modal-body form" hx-post="/ports" hx-target="#form-error" hx-swap="innerHTML" id="port-form">
      <div class="form-error-slot" data-modal-error></div>

      <label class="field">
        <span class="field-label">Port number</span>
        <input class="input" type="number" name="port" min="1024" max="65535" required>
        <span class="field-hint">Must be ≥ 1024. The standard ports 25, 465 and 587 already exist.</span>
      </label>

      <label class="field">
        <span class="field-label">TLS mode</span>
        <select class="select" name="tls_mode">
          <option value="may">STARTTLS (opportunistic)</option>
          <option value="encrypt">STARTTLS (required)</option>
          <option value="none">No TLS</option>
        </select>
      </label>

      <label class="check-row">
        <input class="checkbox" type="checkbox" name="require_sasl" checked>
        <span>Require authentication</span>
      </label>

      <label class="field">
        <span class="field-label">Description (optional)</span>
        <input class="input" type="text" name="description"
               placeholder="Alternative submission port for legacy clients">
      </label>

      <div class="form-actions">
        <button type="button" class="btn" hx-post="/ports/preview" hx-include="#port-form"
                hx-target="#modal-host" hx-swap="innerHTML">
          Preview master.cf
        </button>
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Add port</button>
      </div>
    </form>
  </div>
</div>
{{end}}
