{{define "port_form"}}
<div x-data="{ open: true }" x-show="open" x-cloak @close-modal.window="open = false"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
  <div @click.outside="open = false"
       class="w-full max-w-md rounded-lg border border-slate-800 bg-slate-900 shadow-2xl">
    <header class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
      <h3 class="font-medium">Add SMTP listener</h3>
      <button @click="open = false" class="text-slate-500 hover:text-slate-200">✕</button>
    </header>

    <form hx-post="/ports" hx-target="#form-error" hx-swap="innerHTML" class="p-5 space-y-4">
      <div id="form-error"></div>

      <label class="block">
        <span class="text-sm text-slate-400">Port number</span>
        <input type="number" name="port" min="1024" max="65535" required
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2">
        <span class="text-xs text-slate-500 mt-1 block">Must be ≥ 1024. Standard ports 25/465/587 already exist.</span>
      </label>

      <label class="block">
        <span class="text-sm text-slate-400">TLS mode</span>
        <select name="tls_mode"
                class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2">
          <option value="may">STARTTLS (opportunistic)</option>
          <option value="encrypt">STARTTLS (required)</option>
          <option value="none">No TLS</option>
        </select>
      </label>

      <label class="flex items-center gap-2">
        <input type="checkbox" name="require_sasl" checked>
        <span class="text-sm text-slate-300">Require authentication</span>
      </label>

      <label class="block">
        <span class="text-sm text-slate-400">Description (optional)</span>
        <input type="text" name="description" placeholder="Alternative submission port for legacy clients"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2">
      </label>

      <div class="flex justify-between pt-2">
        <button type="button" hx-post="/ports/preview" hx-include="closest form"
                hx-target="#modal-host" hx-swap="innerHTML"
                class="rounded border border-slate-700 px-3 py-1.5 text-sm hover:bg-slate-800">
          Preview master.cf
        </button>
        <div class="flex gap-2">
          <button type="button" @click="open = false"
                  class="rounded border border-slate-700 px-3 py-1.5 text-sm">Cancel</button>
          <button type="submit"
                  class="rounded bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm font-medium">
            Add port
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{{end}}
