{{define "admin_reset_password"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-reset-title">
  <div class="modal-panel max-w-md">
    <header class="modal-header">
      <h3 id="admin-reset-title">Reset password</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <form class="modal-body form" hx-post="/system/admins/{{.ID}}/reset-password" hx-target="#form-error" hx-swap="innerHTML">
      <div class="form-error-slot" data-modal-error></div>
      <label class="field">
        <span class="field-label">New password</span>
        <input class="input" type="password" name="password" autocomplete="new-password" required>
      </label>
      <div class="form-actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Reset</button>
      </div>
    </form>
  </div>
</div>
{{end}}
