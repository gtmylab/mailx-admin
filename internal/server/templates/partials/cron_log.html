{{define "cron_log"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cron-log-title">
  <div class="modal-panel max-w-2xl">
    <header class="modal-header">
      <h3 id="cron-log-title">{{.Job.Name}} — last run</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="modal-body">
      <div class="kv">
        <span class="kv-label">Status</span>
        <span class="kv-value">{{if .Job.LastStatus}}{{.Job.LastStatus}}{{else}}never run{{end}}</span>
      </div>
      <div class="kv">
        <span class="kv-label">Last run</span>
        <span class="kv-value">{{humanTime .Job.LastRunAt}}</span>
      </div>
      <pre class="mono text-xs mt-3" style="max-height: 360px; overflow: auto;">{{if .Job.LastOutput}}{{.Job.LastOutput}}{{else}}(no output yet){{end}}</pre>
      <div class="form-actions mt-3">
        <button type="button" class="btn" data-close-modal>Close</button>
      </div>
    </div>
  </div>
</div>
{{end}}
