{{define "port_preview"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="port-preview-title">
  <div class="modal-panel max-w-4xl">
    <header class="modal-header">
      <h3 id="port-preview-title">master.cf preview</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="modal-body">
      <div class="form-error-slot" data-modal-error></div>
      <p class="muted text-sm mb-2">This is what Postfix will read after the change:</p>
      <pre class="code code-block">{{.MasterCF}}</pre>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn" data-close-modal>Close</button>
    </footer>
  </div>
</div>
{{end}}
