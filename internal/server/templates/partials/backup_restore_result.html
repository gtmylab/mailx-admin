{{define "backup_restore_result"}}
<div x-data="{ open: true }" x-show="open" x-cloak @close-modal.window="open = false"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
  <div @click.outside="open = false"
       class="w-full max-w-lg rounded-lg border border-slate-800 bg-slate-900 shadow-2xl">
    <header class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
      <h3 class="font-medium">Restore extracted</h3>
      <button @click="open = false" class="text-slate-500 hover:text-slate-200">✕</button>
    </header>
    <div class="p-5 space-y-3">
      <p class="text-sm text-slate-300">
        Backup <code class="font-mono">{{.Name}}</code> has been extracted to:
      </p>
      <div class="rounded bg-slate-950 border border-slate-800 px-3 py-2 font-mono text-sm">
        {{.StagingDir}}
      </div>
      <p class="text-sm text-slate-400">
        <strong class="text-amber-300">Nothing has been applied yet.</strong>
        Inspect the contents, then copy files manually or use a future
        "apply restore" action.
      </p>
    </div>
    <footer class="px-5 py-3 border-t border-slate-800 flex justify-end">
      <button @click="open = false"
              class="rounded bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm">Close</button>
    </footer>
  </div>
</div>
{{end}}
