{{define "backup_restore_result"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="restore-title">
  <div class="modal-panel max-w-lg">
    <header class="modal-header">
      <h3 id="restore-title">Restore extracted</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="modal-body">
      <p class="text-sm muted">
        Backup <code class="mono">{{.Name}}</code> has been extracted to:
      </p>
      <div class="input-group mt-2">
        <input class="input mono text-xs" id="restore-dir" type="text" readonly value="{{.StagingDir}}">
        <button type="button" class="btn" data-copy="#restore-dir">Copy path</button>
      </div>

      <div class="alert alert-warn mt-3">
        <span class="dot" aria-hidden="true"></span>
        <span>
          <strong>Nothing has been applied.</strong> Inspect the extracted files and
          copy them into place manually — overwriting live configuration is
          deliberately not automated.
        </span>
      </div>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" data-close-modal="force">Close</button>
    </footer>
  </div>
</div>
{{end}}
