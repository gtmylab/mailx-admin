{{define "cron_form"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cron-form-title">
  <div class="modal-panel max-w-lg">
    <header class="modal-header">
      <h3 id="cron-form-title">{{if .Job.ID}}Edit job{{else}}Add job{{end}}</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <form class="modal-body form" hx-post="/system/cron" hx-target="#form-error" hx-swap="innerHTML" id="cron-form">
      <div class="form-error-slot" data-modal-error></div>
      <input type="hidden" name="id" value="{{if .Job.ID}}{{.Job.ID}}{{end}}">

      <label class="field">
        <span class="field-label">Name</span>
        <input class="input" type="text" name="name" value="{{.Job.Name}}" placeholder="Nightly backup" required>
      </label>

      <label class="field">
        <span class="field-label">Schedule</span>
        <input class="input mono" type="text" name="schedule" value="{{.Job.Schedule}}" placeholder="30 2 * * *" required>
        <span class="field-hint">Five-field cron: <code>minute hour day-of-month month day-of-week</code>. Examples: <code>*/15 * * * *</code>, <code>0 * * * *</code>, <code>30 2 * * *</code>.</span>
      </label>

      <label class="field">
        <span class="field-label">Command</span>
        <textarea class="input mono" name="command" rows="4" placeholder="/usr/local/bin/backup.sh" required>{{.Job.Command}}</textarea>
        <span class="field-hint">Run by <code>sh -c</code> as root. Output is captured and shown under the job's Log.</span>
      </label>

      <label class="check-row">
        <input class="checkbox" type="checkbox" name="enabled" {{if .Job.Enabled}}checked{{end}}>
        <span>Enabled</span>
      </label>

      <div class="form-actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{{end}}
