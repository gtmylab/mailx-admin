{{define "password_reveal"}}
<div x-data="{ open: true, saved: false, copied: false }"
     x-show="open" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
  <div @click.outside="if (saved) open = false"
       class="w-full max-w-md rounded-lg border border-slate-800 bg-slate-900 shadow-2xl">
    <header class="px-5 py-3 border-b border-slate-800">
      <h3 class="font-medium">🔑 New password</h3>
    </header>

    <div class="p-5 space-y-4">
      <p class="text-sm text-slate-400">
        This password will not be shown again. Copy it now.
      </p>

      <div class="flex items-center gap-2">
        <input x-ref="pw" type="text" readonly value="{{.Password}}"
               class="flex-1 rounded bg-slate-950 border border-slate-800 px-3 py-2 font-mono text-sm">
        <button type="button"
                @click="navigator.clipboard.writeText($refs.pw.value); copied = true; setTimeout(() => copied = false, 2000)"
                class="rounded border border-slate-700 px-3 py-2 text-sm hover:bg-slate-800">
          <span x-text="copied ? '✓' : 'Copy'"></span>
        </button>
      </div>

      <label class="flex items-start gap-2">
        <input type="checkbox" x-model="saved" class="mt-0.5">
        <span class="text-sm text-slate-300">
          I have saved this password somewhere safe.
        </span>
      </label>

      <div class="flex justify-end pt-2">
        <button type="button"
                :disabled="!saved"
                @click="open = false; $dispatch('close-modal')"
                class="rounded bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
          Done
        </button>
      </div>
    </div>
  </div>
</div>
{{end}}
