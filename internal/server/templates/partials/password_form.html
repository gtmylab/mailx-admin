{{define "password_form"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="password-form-title">
  <div class="modal-panel max-w-md">
    <header class="modal-header">
      <h3 id="password-form-title">Reset password</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <form class="modal-body form" hx-post="/users/{{.UserID}}/reset-password"
          hx-target="#modal-host" hx-swap="innerHTML">
      <div class="form-error-slot" data-modal-error></div>

      <div class="field">
        <label class="field-label" for="reset-password">New password</label>
        <div class="input-group">
          <input class="input" id="reset-password" type="password" name="password"
                 required minlength="8" autocomplete="new-password">
          <button type="button" class="btn btn-sm" data-toggle-password="#reset-password" aria-pressed="false">
            show
          </button>
        </div>
        <span class="field-hint">
          The password is shown once after the reset. Use the generator below if you
          need something random.
        </span>
      </div>

      <div class="form-row">
        <button type="button" class="btn btn-sm" data-generate-password="#reset-password">
          Generate a strong password
        </button>
        <span class="dim text-xs">20 random characters, filled into the field above.</span>
      </div>

      <label class="field">
        <span class="field-label">Email the password to (optional)</span>
        <input class="input" type="email" name="send_to" placeholder="alternate@example.com">
        <span class="field-hint">Leave blank to only display the password here.</span>
      </label>

      <div class="form-actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Reset password</button>
      </div>
    </form>
  </div>
</div>
{{end}}
