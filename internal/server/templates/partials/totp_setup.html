{{define "totp_setup"}}
<div class="mt-3">
  <div class="mb-3" style="background:#fff; padding:12px; border-radius:10px; display:inline-block; line-height:0;">
    <img src="{{.QR}}" width="200" height="200" alt="Two-factor authentication QR code">
  </div>
  <div class="field mb-3">
    <span class="field-label">Secret key</span>
    <div class="input-group">
      <input class="input mono text-xs" type="text" value="{{.Secret}}" readonly>
      <button type="button" class="btn" data-copy-value="{{.Secret}}">Copy</button>
    </div>
    <span class="field-hint">Scan the QR code, or enter this key manually in your authenticator app.</span>
  </div>
  <form class="form" hx-post="/account/totp/confirm" hx-target="#account-result" hx-swap="innerHTML">
    <div class="field">
      <span class="field-label">6-digit code</span>
      <div class="otp-inputs">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 2">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 3">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 4">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 5">
        <input class="input otp-input" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 6">
        <input type="hidden" name="code">
      </div>
      <span class="field-hint">Enter the 6-digit code from your authenticator app.</span>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" onclick="document.getElementById('totp-setup').innerHTML=''">Cancel</button>
      <button type="submit" class="btn btn-primary">Verify &amp; enable</button>
    </div>
  </form>
</div>
{{end}}
