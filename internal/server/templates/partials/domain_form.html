{{define "domain_form"}}
<div x-data="{ open: true }" x-show="open" x-cloak @close-modal.window="open = false"
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
  <div @click.outside="open = false" class="w-full max-w-md rounded-lg border border-slate-800 bg-slate-900 shadow-2xl">
    <header class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
      <h3 class="font-medium">{{if .Domain}}Edit domain{{else}}Create domain{{end}}</h3>
      <button type="button" @click="open = false" class="text-slate-500 hover:text-slate-200">✕</button>
    </header>

    <form hx-post="/preview/domain-create"
          hx-target="#modal-host"
          hx-swap="innerHTML"
          class="p-5 space-y-4">

      <div id="form-error"></div>

      {{if not .Domain}}
      <label class="block">
        <span class="text-sm text-slate-400">Domain name</span>
        <input type="text" name="name" required placeholder="example.com"
               pattern="[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+"
               class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2">
        <span class="text-xs text-slate-500 mt-1 block">The mail domain, e.g. "example.com"</span>
      </label>

      <label class="flex items-center gap-2">
        <input type="checkbox" name="make_primary">
        <span class="text-sm text-slate-300">Make this the primary domain</span>
      </label>

      <label class="flex items-center gap-2">
        <input type="checkbox" name="generate_dkim" checked>
        <span class="text-sm text-slate-300">Generate DKIM keys (OpenDKIM)</span>
      </label>
      {{else}}
      <div class="text-sm text-slate-400">
        <span class="font-mono text-slate-200">{{.Domain.Name}}</span>
      </div>
      {{end}}

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" @click="open = false"
                class="rounded border border-slate-700 px-3 py-1.5 text-sm text-slate-300 hover:bg-slate-800">
          Cancel
        </button>
        <button type="submit"
                class="rounded bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-sm font-medium">
          Preview
        </button>
      </div>
    </form>
  </div>
</div>
{{end}}
