{{define "service_health"}}
{{if .Data.Services}}
<div class="list">
  {{range .Data.Services}}
  <div class="list-row">
    <span class="dot {{if eq .Status "active"}}ok-text{{else if eq .Status "unknown"}}dim{{else}}err-text{{end}}"
          aria-hidden="true"></span>
    <span class="strong text-sm">{{.Name}}</span>
    <span class="badge ml-auto {{if eq .Status "active"}}ok{{else if eq .Status "unknown"}}{{else}}err{{end}}">
      {{.Status}}
    </span>
  </div>
  {{end}}
</div>
{{else}}
<div class="empty">
  <span class="empty-title">No service information</span>
  <span class="empty-hint">The panel could not query systemd on this host.</span>
</div>
{{end}}
{{end}}
