{{define "ssl_renew_result"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ssl-renew-title">
  <div class="modal-panel max-w-2xl">
    <header class="modal-header">
      <h3 id="ssl-renew-title">
        {{if .Result.Success}}<span class="badge ok">✓ renewed</span>
        {{else}}<span class="badge err">✗ failed</span>{{end}}
        {{if .CertName}}<span class="mono text-sm">{{.CertName}}</span>{{end}}
        <span class="dim text-xs">{{.Result.Duration}}</span>
      </h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="modal-body">
      {{if .Result.Error}}
      <div class="alert alert-err mb-3">
        <span class="dot" aria-hidden="true"></span>
        <span>{{.Result.Error}}</span>
      </div>
      {{end}}
      <details open>
        <summary class="dim text-xs">certbot output</summary>
        <pre class="code code-block">{{.Result.Output}}</pre>
      </details>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn" data-close-modal>Close</button>
      <button type="button" class="btn btn-primary" data-reload>Reload page</button>
    </footer>
  </div>
</div>
{{end}}
