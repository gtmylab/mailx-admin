{{define "admin_form"}}
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-form-title">
  <div class="modal-panel max-w-lg">
    <header class="modal-header">
      <h3 id="admin-form-title">{{if .Admin.ID}}Edit admin{{else}}Add admin{{end}}</h3>
      <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <form class="modal-body form" hx-post="/system/admins" hx-target="#form-error" hx-swap="innerHTML">
      <div class="form-error-slot" data-modal-error></div>
      <input type="hidden" name="id" value="{{if .Admin.ID}}{{.Admin.ID}}{{end}}">

      <div class="grid grid-cols-2 gap-4">
        <label class="field">
          <span class="field-label">Username</span>
          <input class="input" type="text" name="username" value="{{.Admin.Username}}" {{if .Admin.ID}}readonly{{end}} required>
        </label>
        <label class="field">
          <span class="field-label">Full name</span>
          <input class="input" type="text" name="display_name" value="{{.Admin.DisplayName}}" placeholder="Jane Doe">
        </label>
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" name="email" value="{{.Admin.Email}}" placeholder="jane@example.com">
        </label>
        <label class="field">
          <span class="field-label">Role</span>
          <select class="select" name="role">
            {{range .Roles}}<option value="{{.}}" {{if eq . $.Admin.Role}}selected{{end}}>{{.}}</option>{{end}}
          </select>
        </label>
        <label class="field">
          <span class="field-label">Account type</span>
          <select class="select" name="account_type">
            {{range .Types}}<option value="{{.}}" {{if eq . $.Admin.AccountType}}selected{{end}}>{{.}}</option>{{end}}
          </select>
        </label>
        <label class="field">
          <span class="field-label">Session timeout</span>
          <select class="select" name="session_ttl_minutes">
            <option value="0">Default</option>
            <option value="60" {{if eq .Admin.SessionTTLMinutes 60}}selected{{end}}>1 hour</option>
            <option value="120" {{if eq .Admin.SessionTTLMinutes 120}}selected{{end}}>2 hours</option>
            <option value="300" {{if eq .Admin.SessionTTLMinutes 300}}selected{{end}}>5 hours</option>
            <option value="720" {{if eq .Admin.SessionTTLMinutes 720}}selected{{end}}>12 hours</option>
            <option value="1440" {{if eq .Admin.SessionTTLMinutes 1440}}selected{{end}}>24 hours</option>
            <option value="2880" {{if eq .Admin.SessionTTLMinutes 2880}}selected{{end}}>48 hours</option>
            <option value="10080" {{if eq .Admin.SessionTTLMinutes 10080}}selected{{end}}>1 week</option>
          </select>
        </label>
        {{if .Groups}}
        <label class="field">
          <span class="field-label">Group</span>
          <select class="select" name="group_id">
            <option value="0">None</option>
            {{range .Groups}}<option value="{{.ID}}" {{if eq .ID $.Admin.GroupID}}selected{{end}}>{{.Name}}</option>{{end}}
          </select>
        </label>
        {{end}}
      </div>

      {{if not .Admin.ID}}
      <label class="field mt-3">
        <span class="field-label">Password</span>
        <input class="input" type="password" name="password" autocomplete="new-password" required>
      </label>
      {{end}}

      <label class="check-row mt-3">
        <input class="checkbox" type="checkbox" name="enabled" value="1" {{if .Admin.Active}}checked{{end}}>
        <span>Active</span>
      </label>

      <div class="form-actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">{{if .Admin.ID}}Save{{else}}Create{{end}}</button>
      </div>
    </form>
  </div>
</div>
{{end}}
