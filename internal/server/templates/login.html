<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · MailX Admin</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
  <form method="post" action="/login"
        class="w-full max-w-sm rounded-lg border border-slate-800 bg-slate-900 p-8 space-y-4">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

    <div class="text-center">
      <div class="text-2xl font-semibold">⚙ MailX Admin</div>
      <div class="text-sm text-slate-400 mt-1">Sign in to continue</div>
    </div>

    {{if .Error}}
    <div class="rounded border border-red-800 bg-red-950/50 px-3 py-2 text-sm text-red-200">
      {{.Error}}
    </div>
    {{end}}

    <label class="block">
      <span class="text-sm text-slate-400">Username</span>
      <input type="text" name="username" required autofocus
             class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100 focus:border-emerald-600 focus:outline-none">
    </label>

    <label class="block">
      <span class="text-sm text-slate-400">Password</span>
      <input type="password" name="password" required
             class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100 focus:border-emerald-600 focus:outline-none">
    </label>

    {{if .TOTPRequired}}
    <label class="block">
      <span class="text-sm text-slate-400">2FA code</span>
      <input type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
             class="mt-1 w-full rounded bg-slate-950 border border-slate-800 px-3 py-2 text-slate-100 focus:border-emerald-600 focus:outline-none">
    </label>
    {{end}}

    <button type="submit"
            class="w-full rounded bg-emerald-600 hover:bg-emerald-500 px-3 py-2 font-medium transition">
      Sign in
    </button>
  </form>
</body>
</html>
