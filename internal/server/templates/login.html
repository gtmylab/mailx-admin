<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign in · MailX Admin</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="auth-shell">
  <form method="post" action="/login" class="auth-card form" autocomplete="on">
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.8 7 7.3 5.4a1.5 1.5 0 0 0 1.8 0L20.2 7"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">MailX Admin</span>
        <span class="brand-version">Sign in to continue</span>
      </span>
    </div>

    {{if .Error}}
    <div class="alert alert-err" role="alert">
      <span class="dot" aria-hidden="true"></span><span>{{.Error}}</span>
    </div>
    {{end}}

    <label class="field">
      <span class="field-label">Username</span>
      <input class="input" type="text" name="username" required autofocus
             autocomplete="username" spellcheck="false">
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input class="input" type="password" name="password" required autocomplete="current-password">
    </label>

    {{if .TOTPRequired}}
    <label class="field">
      <span class="field-label">Two-factor code</span>
      <input class="input" type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}"
             maxlength="6" autocomplete="one-time-code" placeholder="123456">
      <span class="field-hint">6-digit code from your authenticator app.</span>
    </label>
    {{end}}

    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>

    <div class="auth-foot">MailX Admin · mailx-admin</div>
  </form>
</div>
</body>
</html>
